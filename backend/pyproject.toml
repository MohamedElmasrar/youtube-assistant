[project]
name = "youtube-assistant-backend"
version = "0.1.0"
description = "YouTube assistant backend: LangGraph agent, RAG, MCP tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic>=2",
  "pydantic-settings",
  "langgraph",
  "langchain>=1",
  "langchain-core",
  "langchain-google-genai",
  "langchain-huggingface",
  "langchain-qdrant",
  "langchain-text-splitters",
  "langchain-mcp-adapters",
  "mcp",
  "qdrant-client",
  "sentence-transformers",
  "youtube-transcript-api",
  "httpx",
]

[dependency-groups]
dev = ["langgraph-cli[inmem]", "pytest", "pytest-asyncio", "ruff"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by `ruff format`
